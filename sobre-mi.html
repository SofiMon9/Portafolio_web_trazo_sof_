<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sobre mí · Trazo</title>
  <meta name="description" content="Portafolio de Sofía Moncada Jaramillo, diseñadora crossmedia en Pereira, Colombia. Arte desde el alma y corazón.">

  <!-- Tipografías: Jost (textos) y Pinyon Script (cursiva) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&family=Pinyon+Script&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">

  <!-- Antes de pintar: tema guardado y cortina de llegada -->
  <script>
    (function () {
      var r = document.documentElement;
      try {
        var t = localStorage.getItem('sof-theme');
        if (t) r.dataset.theme = t;
        if (sessionStorage.getItem('sof-cortina')) {
          r.classList.add('cortina');
          sessionStorage.removeItem('sof-cortina');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body data-pagina="sobre-mi">

  <!-- Dibujos reutilizables (estrella de 4 puntas) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="estrella" viewBox="0 0 24 24">
      <path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/>
    </symbol>
  </svg>

  <!-- ============ BARRA SUPERIOR ============ -->
  <header class="barra">
    <a class="marca-nombre" href="inicio.html">Sofía Moncada<span class="nombre-extra"> - Portafolio 2026</span></a>

    <!-- Enlaces principales (en celular se abren con el botón de menú) -->
    <nav class="nav" id="nav" aria-label="Principal">
      <a class="nav-enlace" href="inicio.html">Inicio</a>
      <a class="nav-enlace" href="sobre-mi.html" aria-current="page">Sobre mí</a>
      <a class="nav-enlace" href="proyectos.html">Proyectos</a>
      <a class="nav-cta" href="planes.html">¡Trabajemos!</a>
    </nav>

    <div class="barra-acciones">
      <!-- Interruptor tipo píldora: sol a la izquierda (claro), luna a la derecha (oscuro) -->
      <button class="tema" id="btnTema" type="button" role="switch" aria-label="Modo oscuro">
        <span class="perilla">
          <svg class="ico-sol" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>
          </svg>
          <svg class="ico-luna" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/>
          </svg>
        </span>
      </button>

      <!-- Botón de menú (solo en celular) -->
      <button class="menu-btn" id="btnMenu" type="button" aria-expanded="false" aria-controls="nav" aria-label="Abrir menú">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main>

    <!-- ============ SOBRE Mí (temporal: "Muy pronto") ============ -->
    <section class="vista pronto" aria-labelledby="pronto-titulo">
      <div class="deco" aria-hidden="true">
        <svg class="deco-estrella e1"><use href="#estrella"/></svg>
        <svg class="deco-estrella e3"><use href="#estrella"/></svg>
      </div>
      <div class="contenedor pronto-caja">
        <p class="script pronto-script">Muy pronto</p>
        <h1 id="pronto-titulo">Sobre mí</h1>
        <p>Esta página todavía la estamos construyendo.</p>
        <a class="boton" href="index.html">Volver al estante</a>
      </div>
    </section>

  </main>

  <!-- Transición entre páginas: 4 franjas de color -->
  <div class="franjas" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
